<div class="chat-header">
  <button type="button" class="chat-header__back" (click)="backPressed.emit()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <img
    class="chat-header__avatar"
    [src]="contact() | avatar"
    [alt]="contact().name"
  />

  <div class="chat-header__info">
    <span class="chat-header__name">{{ contact().name }}</span>
    <span class="chat-header__status">
  <span
    class="chat-header__status-dot"
    [class.chat-header__status-dot--online]="contact().status === 'online'"
  ></span>
      {{ contact().status }}
</span>
  </div>
</div>
