@if (contact()) {
  <app-chat-header [contact]="contact()!" (backPressed)="backPressed.emit()" />
  <app-message-list
    [messages]="messages()"
    [currentUserId]="currentUserId()"
    [contactAvatar]="contact()! | avatar"
    [contactName]="contact()!.name"
    [userAvatar]="userAvatar() || '/assets/user-avatar.svg'"
  />
  <div class="chat-area__input-wrapper">
    <app-message-input (messageSent)="onMessageSent($event)" [activeContactId]="contact()!.id"/>
  </div>
} @else {
  <div class="chat-area__empty"></div>
}
